name: Offline tests

on:
  pull_request:
    paths:
      - '**.py'
      - 'scheduler/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'scheduler/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -B -m unittest discover -s tests -v
      - run: node --test scheduler/worker.test.mjs
