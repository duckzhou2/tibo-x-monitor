name: Monitor Tibo on X

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run normal monitoring or send a translated sample"
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - sample
          - resend
          - test-email
      resend_since_id:
        description: "Exclusive lower post ID for a resend"
        required: false
        type: string
      resend_through_id:
        description: "Inclusive upper post ID for a resend"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tibo-x-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check for new posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ADDITIONAL_ALERT_EMAIL: ${{ secrets.ADDITIONAL_ALERT_EMAIL }}
          THIRD_ALERT_EMAIL: ${{ secrets.THIRD_ALERT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TARGET_USERNAME: thsottiaux
        run: |
          if [ "${{ inputs.mode }}" = "test-email" ]; then
            python - <<'PY'
          import os
          import uuid
          from monitor import Config, SMTPEmailClient

          config = Config.from_env()
          recipient = os.environ["THIRD_ALERT_EMAIL"].strip()
          if not recipient:
              raise ValueError("THIRD_ALERT_EMAIL is required for the email test.")
          client = SMTPEmailClient(config.smtp_host, config.smtp_port,
                                   config.smtp_username, config.smtp_app_password,
                                   (recipient,))
          client.send(subject="[Tibo Monitor] Test 邮件",
                      text="这是一封 Tibo 监控测试邮件。你的邮箱已加入收件人列表，今后有新内容时会收到通知。",
                      html_body="<p>这是一封 Tibo 监控测试邮件。你的邮箱已加入收件人列表，今后有新内容时会收到通知。</p>",
                      idempotency_key=f"test-{uuid.uuid4()}")
          print("Test email accepted by SMTP server.")
          PY
          elif [ "${{ inputs.mode }}" = "sample" ]; then
            python monitor.py --sample
          elif [ "${{ inputs.mode }}" = "resend" ]; then
            python monitor.py \
              --resend-since-id "${{ inputs.resend_since_id }}" \
              --resend-through-id "${{ inputs.resend_through_id }}"
          else
            python monitor.py
          fi

      - name: Persist monitor state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update monitor state"
          git push
