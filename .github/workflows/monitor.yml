name: Monitor Tibo on X

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run normal monitoring or send a translated sample"
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - sample
          - resend
          - test-email
      resend_since_id:
        description: "Exclusive lower post ID for a resend"
        required: false
        type: string
      resend_through_id:
        description: "Inclusive upper post ID for a resend"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tibo-x-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh main and snapshot formal state
        run: python -B persist_state.py prepare

      - name: Check for new posts
        id: monitor
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ADDITIONAL_ALERT_EMAIL: ${{ secrets.ADDITIONAL_ALERT_EMAIL }}
          THIRD_ALERT_EMAIL: ${{ secrets.THIRD_ALERT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT || '465' }}
          TARGET_USERNAME: thsottiaux
          MODE: ${{ inputs.mode || 'monitor' }}
          RESEND_SINCE_ID: ${{ inputs.resend_since_id }}
          RESEND_THROUGH_ID: ${{ inputs.resend_through_id }}
          MONITOR_REPORT_PATH: ${{ github.workspace }}/.git/tibo-run.json
        shell: bash
        run: |
          case "$MODE" in
            monitor) python -B monitor.py ;;
            sample) python -B monitor.py --sample ;;
            resend) python -B monitor.py --resend-since-id "$RESEND_SINCE_ID" --resend-through-id "$RESEND_THROUGH_ID" ;;
            test-email) python -B monitor.py --test-email ;;
            *) echo "Invalid monitor mode"; exit 1 ;;
          esac

      - name: Persist monitor state
        if: success()
        run: python -B persist_state.py persist

      - name: Report unsuccessful run
        if: failure() || cancelled()
        shell: bash
        run: |
          echo '## Run incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check the failed step and monitor counters. State persistence is not confirmed. SMTP acceptance before interruption can cause duplicate email on retry.' >> "$GITHUB_STEP_SUMMARY"
